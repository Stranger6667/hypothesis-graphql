[tox]
isolated_build = true
envlist = py{310,311,312,313,314,315}-graphql{31,32,33},coverage-report

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
    3.15: py315

[gh-actions:env]
GRAPHQL_CORE =
    3.1: graphql31
    3.2: graphql32
    3.3: graphql33

[testenv]
deps =
  graphql31: graphql-core>=3.1,<3.2
  graphql32: graphql-core>=3.2,<3.3
  graphql33: graphql-core>=3.3,<3.4
extras =
  tests
  cov
setenv = COVERAGE_PROCESS_START={toxinidir}/pyproject.toml
commands =
  coverage run -m pytest {posargs:-n auto --durations=10} test
  coverage combine --keep
  coverage report
  coverage xml -i
allowlist_externals =
  coverage

[testenv:coverage-report]
description = Report coverage over all measured test runs.
basepython = python3.10
skip_install = true
depends = py{310,311,312,313,314,315}-graphql{31,32,33}
commands =
    coverage combine
    coverage report
    coverage xml -i {posargs:}
